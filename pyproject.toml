[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "robosidelink-m2"
version = "0.1.0"
description = "A reproducible slot-level simulator for NR sidelink Mode 2 research"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "PyYAML>=6.0",
    "numpy>=2.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
robosidelink = "robosidelink.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["robosidelink"]
